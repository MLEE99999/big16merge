# ===================================================
# 20. 웹툰 대시보드 - 프론트엔드(React) 배포
# ===================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webtoon-dashboard-frontend-deployment
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: webtoon-dashboard-frontend
  template:
    metadata:
      labels:
        app: webtoon-dashboard-frontend
    spec:
      nodeSelector:
        agentpool: userpool
      containers:
        - name: webtoon-dashboard-frontend-container
          image: kt16big.azurecr.io/webtoon-dashboard-frontend-lee:${IMAGE_TAG}
          ports:
            - containerPort: 80
          workingDir: /usr/share/nginx/html
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
# ===================================================
# 21. 웹툰 대시보드 - 프론트엔드 서비스 (ClusterIP)
# ===================================================
apiVersion: v1
kind: Service
metadata:
  name: webtoon-dashboard-frontend-service
spec:
  type: ClusterIP
  selector:
    app: webtoon-dashboard-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

# ===================================================
# 🚨 Ingress 제거됨 - 게이트웨이를 통해 라우팅
# ===================================================
# Ingress가 제거되었습니다. 이제 게이트웨이를 통해 접근합니다.
# 접근 경로: 게이트웨이:9000/webtoon/** → 프론트엔드:80
# 
# 📝 주의사항: 웹툰 프론트엔드 앱에서 라우팅 경로를 /webtoon/** 에 맞게 
# 수정이 필요할 수 있습니다. (예: React Router의 basename 설정)